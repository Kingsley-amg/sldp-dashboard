# Pulls the SLDP Kobo forms, rebuilds the dashboard data and the encrypted
# patient queue, and publishes docs/ to GitHub Pages. Runs every 6 hours, on
# every push to main, and on demand (Actions > Update SLDP dashboard > Run workflow).
name: Update SLDP dashboard

on:
  schedule:
    - cron: "17 */6 * * *"        # 00:17, 06:17, 12:17, 18:17 Accra time (UTC)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Kobo token
        id: token
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: |
          if [ -n "$KOBO_TOKEN" ]; then echo "live=true" >> "$GITHUB_OUTPUT"; else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KOBO_TOKEN secret not set. Publishing the demonstration data."; fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.token.outputs.live == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.token.outputs.live == 'true'
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::dplyr
            any::tidyr
            any::purrr
            any::stringr
            any::tibble
            any::lubridate
            any::survival

      - uses: actions/setup-node@v4
        if: steps.token.outputs.live == 'true'
        with:
          node-version: 20

      - name: Pull Kobo data and build the dashboard data
        if: steps.token.outputs.live == 'true'
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          SLDP_RAW_DIR: ${{ runner.temp }}/sldp_raw          # raw records and the plain queue never enter docs/
          SLDP_INCLUDE_TEST: ${{ vars.SLDP_INCLUDE_TEST }}   # repository variable; "true" shows training (TEST) records
          SLDP_PILOT_START: ${{ vars.SLDP_PILOT_START }}     # repository variable, e.g. 2026-10-01 (optional)
        run: Rscript R/build_dashboard_data.R

      - name: Encrypt the patient queue
        if: steps.token.outputs.live == 'true'
        env:
          QUEUE_PASSWORD: ${{ secrets.QUEUE_PASSWORD }}
        run: node tools/encrypt_queue.mjs "${{ runner.temp }}/sldp_raw/queue.json" docs/data/queue.enc.json

      - name: Make sure no plain patient data is published
        run: |
          if grep -rlE 'GA-[0-9A-F]{8}' docs/ --include='*.json' | grep -v 'queue.enc.json'; then
            echo "::error::Patient IDs found in docs/. Not publishing."; exit 1; fi
          test ! -e docs/data/queue.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
